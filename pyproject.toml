[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.typos.default.extend-words]
# Nederlandse woorden die in de README en testdocumentatie voorkomen.
bord = "bord"
conclusie = "conclusie"
controle = "controle"
controles = "controles"
eis = "eis"
expliciet = "expliciet"
fase = "fase"
foto = "foto"
horizontale = "horizontale"
indien = "indien"
infrastructuur = "infrastructuur"
instelling = "instelling"
interacties = "interacties"
isolatie = "isolatie"
leeg = "leeg"
legt = "legt"
lokale = "lokale"
mobiel = "mobiel"
navigatie = "navigatie"
openen = "openen"
proces = "proces"
symptoom = "symptoom"
tabel = "tabel"
titel = "titel"
wel = "wel"
wil = "wil"
